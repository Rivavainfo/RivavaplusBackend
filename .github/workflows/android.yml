name: Build Rivava Android (APK & AAB)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Executable Permissions for Gradle Wrapper
        run: chmod +x gradlew

      - name: Restore Release Keystore (If Secret Provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret provided. Decoding release keystore..."
            mkdir -p app/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
            echo "SIGNED_BUILD=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_BASE64 secret not found. Proceeding with standard build."
            echo "SIGNED_BUILD=false" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Building APK via Gradle..."
          if [ "$SIGNED_BUILD" = "true" ] && [ -f "app/keystore/release.keystore" ]; then
            ./gradlew :app:assembleRelease \
              -Pandroid.injected.signing.store.file="$(pwd)/app/keystore/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew :app:assembleRelease || ./gradlew :app:assembleDebug
          fi

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Building Release AAB via Gradle..."
          if [ "$SIGNED_BUILD" = "true" ] && [ -f "app/keystore/release.keystore" ]; then
            ./gradlew :app:bundleRelease \
              -Pandroid.injected.signing.store.file="$(pwd)/app/keystore/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew :app:bundleRelease
          fi

      - name: Upload Rivava-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rivava-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload Rivava-AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rivava-AAB
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
